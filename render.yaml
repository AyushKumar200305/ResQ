# ==============================================================================
# ResQ — Dynamic Disaster Evacuation & Resource Routing System
# Render Infrastructure-as-Code (Blueprint Specification)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Python Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: resq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://resq-frontend.onrender.com

  # ----------------------------------------------------------------------------
  # 2. React + TypeScript + Vite Frontend Static Site (Served via Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: resq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://resq-backend.onrender.com
